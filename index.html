<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>miji</title>
    <link rel="stylesheet" href="/miji-app/fonts/fonts.css" />
    <script type="module" crossorigin src="/miji-app/assets/index-CQmvie9H.js"></script>
    <link rel="stylesheet" crossorigin href="/miji-app/assets/index-B71t9BIa.css">
  </head>
  <body>
    <canvas id="board" tabindex="0"></canvas>
    <textarea id="text-editor" spellcheck="false" dir="auto"></textarea>

    <div class="topbar">
      <div class="views project">
        <button id="menu-toggle" class="icon" title="Меню" aria-haspopup="true">☰</button>
        <button id="project-name" class="name" title="Карта проекта"></button>
        <span class="sep" id="board-sep" hidden>›</span>
        <span class="board" id="board-name" hidden></span>
        <ul class="menu" id="menu" hidden>
          <li><button id="archive-toggle">Архив <span class="badge" id="archive-count"></span></button></li>
          <li><label><input type="checkbox" id="sim" /> Коллеги (демо)</label></li>
          <li><label><input type="checkbox" id="fps-toggle" /> Показать FPS</label></li>
        </ul>
      </div>
      <div class="search">
        <input
          id="query"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="Фильтр задач: status = &quot;В работе&quot; AND assignee = me"
          title="Фильтр задач (/)"
        />
        <span class="count" id="query-count"></span>
        <div class="query-error" id="query-error" hidden></div>
        <ul class="suggest" id="query-suggest" hidden></ul>
      </div>
    </div>

    <div class="people" id="people">
      <span class="others" id="people-others"></span>
      <span class="me" id="people-me"></span>
    </div>

    <div class="panel" id="panel">
      <div class="row"><span>Задач / связей</span><b id="counts">–</b></div>
      <div class="row"><span>Видно / инстансов</span><b id="visible">–</b></div>
      <div class="row"><span>Масштаб</span><b id="zoom">100%</b></div>
      <div class="row"><span>FPS</span><b id="fps">–</b></div>
    </div>

    <aside class="issue-panel" id="issue-panel" hidden>
      <header>
        <nav class="path" id="ip-path"></nav>
        <button class="icon" id="ip-more" title="Ещё" aria-haspopup="true">⋯</button>
        <button class="close" id="ip-close" title="Закрыть (Esc)">×</button>
        <ul class="menu ip-menu" id="ip-menu" hidden>
          <li><button id="ip-open">Перейти к задаче</button></li>
          <li><button id="ip-copy">Скопировать ключ</button></li>
          <li class="sep"></li>
          <li><button id="ip-archive" class="danger" title="Задача уходит в архив и пропадает с холста; Ctrl+Z вернёт">Отменить задачу</button></li>
        </ul>
      </header>
      <textarea class="title" id="ip-title" rows="1" spellcheck="false"></textarea>
      <div class="props" id="ip-props"></div>
      <div class="description" id="ip-description"><div class="loading">Загружаю редактор…</div></div>
      <p class="md-hint">Markdown: **жирный**, # заголовок, - список, `код`</p>
      <section id="ip-children-box">
        <h4>Подзадачи <span class="progress" id="ip-progress"></span><button class="add" id="ip-add-sub">+ Новая</button></h4>
        <ul id="ip-children"></ul>
      </section>
      <section id="ip-links-box"><h4>Связи</h4><ul id="ip-links"></ul></section>
      <div class="chips" id="ip-reactions"></div>
    </aside>
    <div class="popover" id="ip-pop" hidden>
      <input id="ip-pop-search" type="text" placeholder="Поиск" spellcheck="false" autocomplete="off" />
      <ul id="ip-pop-list"></ul>
    </div>
    <aside class="issue-panel archive-panel" id="archive-panel" hidden>
      <header>
        <span class="key">Архив</span>
        <span class="crumbs">отменённые задачи</span>
        <button class="close" id="archive-close" title="Закрыть (Esc)">×</button>
      </header>
      <p class="empty" id="archive-empty">Пусто. Отменить задачу можно в меню её статуса или в панели задачи.</p>
      <ul class="archive-list" id="archive-list"></ul>
    </aside>
    <div class="reactions" id="reactions" hidden></div>
    <div class="error" id="error" hidden></div>

  </body>
</html>
